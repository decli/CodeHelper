name: Android Release

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android 16 build packages
              run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

            # 优先使用仓库 Secrets 中的固定签名密钥（RELEASE_KEYSTORE_BASE64），
            # 保证每个版本签名一致、可覆盖安装升级；
            # 未配置 Secrets 时回退为一次性密钥并给出警告（此时升级需先卸载旧版）。
            - name: Prepare release keystore
              env:
                  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
              run: |
                  if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
                    printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
                    echo "使用仓库 Secrets 中的固定签名密钥"
                  else
                    echo "::warning title=未配置固定签名密钥::本次构建使用一次性密钥签名，用户覆盖安装升级会因签名不一致失败。请按 README「发布签名配置」一节配置 RELEASE_KEYSTORE_BASE64 等 Secrets。"
                    keytool -genkeypair -v \
                      -keystore "$GITHUB_WORKSPACE/release.keystore" \
                      -storepass android \
                      -keypass android \
                      -alias codehelper \
                      -keyalg RSA \
                      -keysize 2048 \
                      -validity 3650 \
                      -dname "CN=CodeHelper,O=CodeHelper,C=CN"
                  fi

            - name: Ensure Gradle wrapper is executable
              run: chmod +x gradlew

            - name: Build release APK
              env:
                  RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
                  RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
                  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'codehelper' }}
                  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
              run: |
                  set -o pipefail
                  ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle-build.log

            - name: Show Gradle failure excerpt
              if: failure()
              run: |
                  tail -n 200 gradle-build.log || true
                  python3 - <<'PY'
                  from pathlib import Path
                  log_path = Path("gradle-build.log")
                  if not log_path.exists():
                      print("::error title=Gradle build failed::gradle-build.log was not generated")
                      raise SystemExit(0)
                  lines = log_path.read_text(encoding="utf-8", errors="ignore").splitlines()
                  patterns = (
                      "e: ",
                      "error: ",
                      "Execution failed for task",
                      "A failure occurred while executing",
                      "What went wrong",
                      "FAILURE: Build failed with an exception.",
                  )
                  windows = []
                  for index, line in enumerate(lines):
                      if any(pattern in line for pattern in patterns):
                          start = max(0, index - 8)
                          end = min(len(lines), index + 24)
                          windows.append("\n".join(lines[start:end]))
                  excerpt = "\n\n---\n\n".join(dict.fromkeys(windows)) if windows else "\n".join(lines[-160:])
                  excerpt = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Gradle build failed::{excerpt}")
                  PY

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: CodeHelper-release-apk
                  path: app/build/outputs/apk/release/*.apk

            - name: Read app version
              id: appversion
              run: |
                  VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

            - name: Publish tagged release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  files: app/build/outputs/apk/release/*.apk

            - name: Publish release from main
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.appversion.outputs.tag }}
                  name: ${{ steps.appversion.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  files: app/build/outputs/apk/release/*.apk
                  fail_on_unmatched_files: true
